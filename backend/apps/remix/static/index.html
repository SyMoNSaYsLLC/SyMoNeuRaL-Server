<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyMoNeuRaL Remix</title>
<!--
  The shell for the STANDALONE symoneural_dj process (its own port, `run.sh`), not for the
  rack. The rack's remix page is `site/remix.html`, generated by `tools/build_pages.py` and
  served by the main API; this file is what `app.py`'s `/` route returns when the DJ runs on
  its own, and `_INDEX_HTML` at app.py:43 has pointed here since it was written.

  It had never been in this repository. `symoneural_dj` arrived from the old
  /home/google/AI_Local_NVIDIA tree and its `static/` directory did not come with it -- the
  same omission as the two sibling packages that made the whole app unimportable, and the
  reason `test_index_is_open_html` failed with a RuntimeError on a path that does not exist
  rather than with anything about HTML.

  Deliberately dependency-free: no CDN, no build step, no framework. The DJ box is the one
  machine that must keep working when nothing else does, and a shell that fetches a script
  from the internet is a shell that is blank on a network the box cannot reach.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0e13; color: #e6e9ef; font: 15px/1.55 ui-sans-serif,
         system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.35rem; letter-spacing: .02em; margin: 0 0 .35rem; }
  .sub { color: #8b95a7; margin: 0 0 2rem; font-size: .9rem; }
  label { display: block; margin: 1.1rem 0 .35rem; font-size: .82rem; color: #9aa4b6;
          text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: .6rem .7rem;
          background: #151a22; color: inherit; border: 1px solid #263041; border-radius: 6px;
          font: inherit; }
  textarea { min-height: 5rem; resize: vertical; }
  button { margin-top: 1.5rem; padding: .65rem 1.2rem; background: #2b6ef5; color: #fff;
           border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { background: #2a3444; color: #6b7688; cursor: default; }
  /* Wraps rather than truncating: an ellipsis on a status line is data loss, and the job
     state is the one thing on this page a person is waiting to read. */
  #out { margin-top: 1.75rem; padding: .9rem 1rem; background: #10151d; border-radius: 6px;
         border: 1px solid #1e2735; white-space: pre-wrap; overflow-wrap: anywhere;
         min-height: 1.5rem; font-size: .88rem; }
</style>

<main>
  <h1>SyMoNeuRaL Remix</h1>
  <p class="sub">Describe a mood. The local engine picks the tracks and builds the playlist.</p>

  <label for="who">Listener</label>
  <select id="who"><option value="">loading…</option></select>

  <label for="prompt">Prompt</label>
  <textarea id="prompt" maxlength="2000" placeholder="rainy day indie, nothing after 2015"></textarea>

  <label for="count">Tracks</label>
  <input id="count" type="number" value="30" min="5" max="100">

  <button id="go">Build playlist</button>
  <div id="out" role="status" aria-live="polite"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const out = $("out");
  const say = (msg) => { out.textContent = msg; };

  // Same-origin and credentialed: this shell is served BY the app it calls, so the session
  // cookie rides along and no token is ever put in the page. A bearer in client JS is a
  // bearer in every visitor's view-source.
  const api = (path, opts = {}) =>
    fetch(path, { credentials: "same-origin", ...opts });

  async function loadUsers() {
    try {
      const r = await api("/users");
      if (r.status === 401) { say("Sign in, then connect Spotify to get started."); return; }
      const { users } = await r.json();
      const sel = $("who");
      sel.innerHTML = "";
      if (!users.length) {
        sel.innerHTML = '<option value="">no connected accounts</option>';
        say("No Spotify account connected yet. Visit /spotify/connect.");
        return;
      }
      for (const u of users) {
        const o = document.createElement("option");
        o.value = u.user;
        o.textContent = u.display_name || u.user;
        sel.append(o);
      }
    } catch (err) {
      say("Could not reach the DJ: " + err.message);
    }
  }

  async function poll(jobId) {
    // Terminal states end the loop. `error` is surfaced verbatim rather than reduced to
    // "failed" -- the refund path runs inside run_job and the reason is what says whether it
    // did.
    for (;;) {
      await new Promise((r) => setTimeout(r, 1200));
      const r = await api("/playlist/" + encodeURIComponent(jobId));
      if (!r.ok) { say("Lost the job: HTTP " + r.status); return; }
      const job = await r.json();
      say(JSON.stringify(job, null, 2));
      if (["done", "error", "failed", "cancelled"].includes(job.state)) return;
    }
  }

  $("go").addEventListener("click", async () => {
    const btn = $("go");
    btn.disabled = true;
    say("Submitting…");
    try {
      const r = await api("/playlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: $("prompt").value,
          user: $("who").value,
          track_count: Number($("count").value) || 30,
        }),
      });
      const body = await r.json();
      if (!r.ok) { say("Refused (" + r.status + "): " + (body.error || "unknown")); return; }
      say("Job " + body.job_id + " accepted…");
      await poll(body.job_id);
    } catch (err) {
      say("Request failed: " + err.message);
    } finally {
      btn.disabled = false;
    }
  });

  loadUsers();
</script>
