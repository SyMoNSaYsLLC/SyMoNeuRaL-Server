[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symoneural-reinforce"
version = "0.1.0"
description = "Native CUDA inference and compute engine built on cuda.core primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "symoneural" }]
keywords = ["cuda", "gpu", "inference", "nvrtc", "blackwell", "sm_120"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",
]

dependencies = [
    "cuda-python>=13.0.0",
    "cuda-core>=1.0.0",
    "cupy-cuda13x>=14.0.0",
    "numpy>=2.3.2",
    "cuda-cccl[cu13]>=1.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.0.0"]
mpi    = ["mpi4py>=4.0.0"]           # also needs: apt install openmpi-bin
dev    = ["pytest>=8.0.0", "httpx>=0.27.0"]
all    = ["symoneural-reinforce[server,mpi,dev]"]

[project.scripts]
symoneural-bench = "bench.run_all:main"

[tool.setuptools.packages.find]
include = ["symoneural*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "multigpu: requires 2+ GPUs; waived on single-GPU boxes",
    "cooperative: requires cooperative launch + libcu++ headers",
    "mpi: requires mpirun --oversubscribe -np 2",
    "green: requires green-context SM partitioning",
    "slow: benchmark-scale test",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
